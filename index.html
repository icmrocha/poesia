<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Poesias — Ivan Rocha</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3eee4; --paper: #fbf7f0; --ink: #2b241c;
      --ink-soft: #5c5348; --line: #d9cfc0; --star: #b8860b; --heart: #b42318;
      --sans: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: radial-gradient(900px 420px at 8% -8%, #f8f1e4, transparent 60%), var(--bg);
      color: var(--ink);
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 24px 16px 72px; }
    .top {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px; flex-wrap: wrap;
    }
    h1 { font-weight: 600; font-size: clamp(1.6rem, 4.5vw, 2.2rem); margin: 0; letter-spacing: -0.02em; }
    .sub { color: var(--ink-soft); margin: 6px 0 0; }
    header { border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 16px; }
    .menu { position: relative; }
    .menu > button, .chip {
      border: 1px solid var(--line); background: var(--paper); border-radius: 999px;
      padding: 10px 14px; font: inherit; cursor: pointer; color: var(--ink);
    }
    .chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .drop {
      display: none; position: absolute; right: 0; top: calc(100% + 6px);
      background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
      min-width: 240px; max-width: 86vw; padding: 6px; z-index: 20;
      box-shadow: 0 10px 30px rgba(40,30,20,.12);
    }
    .drop.open { display: block; }
    .drop button {
      display: block; width: 100%; text-align: left; border: 0; background: transparent;
      padding: 10px 12px; font: inherit; border-radius: 10px; cursor: pointer; color: var(--ink);
    }
    .drop button:hover { background: #efe8dc; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .search { flex: 1 1 220px; }
    .search input {
      width: 100%; border: 1px solid var(--line); background: var(--paper);
      border-radius: 999px; padding: 11px 16px; font: inherit; color: var(--ink);
    }
    .meta { color: var(--ink-soft); font-size: 0.9rem; margin: 4px 0 14px; }
    .grid { display: grid; gap: 10px; }
    .card {
      background: var(--paper); border: 1px solid var(--line); border-radius: 16px;
      padding: 16px 16px 14px; cursor: pointer;
    }
    .card h2 { font-weight: 600; font-size: 1.12rem; margin: 0 8px 0 0; letter-spacing: -0.01em; }
    .card-top { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
    .icons { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
    .icon {
      border: 0; background: transparent; font-size: 1.2rem; cursor: pointer;
      line-height: 1; color: #c5b49a; padding: 2px;
    }
    .icon.star.on { color: var(--star); }
    .icon.heart.on { color: var(--heart); }
    .preview { margin: 8px 0 0; color: var(--ink-soft); white-space: pre-line; max-height: 4.2em; overflow: hidden; line-height: 1.4; }
    .empty { text-align: center; padding: 40px 8px; color: var(--ink-soft); }
    dialog { border: 0; border-radius: 18px; width: min(860px, calc(100vw - 16px)); max-height: calc(100vh - 16px); padding: 0; background: var(--paper); }
    dialog::backdrop { background: rgba(30, 24, 18, 0.48); }
    .reader { padding: 22px 20px 28px; }
    .reader-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .reader h2 { font-weight: 600; font-size: clamp(1.3rem, 3.6vw, 1.75rem); margin: 0 0 6px; letter-spacing: -0.02em; }
    .close { border: 0; background: transparent; font-size: 1.5rem; cursor: pointer; color: var(--ink-soft); }
    .poem { font-size: 1.08rem; line-height: 1.65; white-space: pre-wrap; margin-top: 18px; }
    .pdf { width: 100%; height: min(78vh, 820px); border: 0; margin-top: 12px; border-radius: 10px; background: #ddd; }
    footer { margin-top: 28px; color: var(--ink-soft); font-size: 0.82rem; }
    .nota { background: #efe4cf; border-radius: 12px; padding: 10px 12px; margin: 0 0 14px; color: #5a4a32; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="top">
        <div>
          <h1 id="titulo">Poesias</h1>
          <p class="sub" id="subtitulo"></p>
        </div>
        <div class="menu">
          <button type="button" id="btn-comp">Compilações ▾</button>
          <div class="drop" id="drop-comp"></div>
        </div>
      </div>
      <div class="controls">
        <label class="search"><input id="q" type="search" placeholder="Buscar título ou verso…" autocomplete="off" /></label>
        <button class="chip active" id="f-todas" type="button">Todas</button>
        <button class="chip" id="f-autor" type="button">★ Favoritos do autor</button>
        <button class="chip" id="f-meus" type="button">♥ Meus favoritos</button>
      </div>
    </header>
    <p class="nota" id="nota" hidden></p>
    <p class="meta" id="contagem"></p>
    <div class="grid" id="lista"></div>
    <p class="empty" id="vazio" hidden>Nenhum poema encontrado.</p>
    <footer>★ é favorito do autor no Drive. ♥ é só neste aparelho.</footer>
  </div>
  <dialog id="ler">
    <div class="reader">
      <div class="reader-head">
        <div>
          <h2 id="ler-titulo"></h2>
          <div class="sub" id="ler-meta"></div>
        </div>
        <div class="icons">
          <button class="icon heart" id="ler-heart" type="button" aria-label="Meu favorito">♡</button>
          <button class="close" id="fechar" aria-label="Fechar">×</button>
        </div>
      </div>
      <div class="poem" id="ler-texto"></div>
      <iframe class="pdf" id="ler-pdf" hidden title="PDF"></iframe>
    </div>
  </dialog>
  <script>
    let DADOS = { titulo: "Poesias", subtitulo: "Ivan Rocha", poemas: [], compilacoes: [], nota: "" };
    const STORE = "poesias-coracoes-v1";
    let filtro = "todas";
    let aberto = null;
    const coracoes = new Set(JSON.parse(localStorage.getItem(STORE) || "[]"));
    const $ = (id) => document.getElementById(id);
    function n(s) { return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
    function esc(s) { return String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
    function temCoracao(id) { return coracoes.has(id); }
    function toggleCoracao(id) {
      if (coracoes.has(id)) coracoes.delete(id); else coracoes.add(id);
      localStorage.setItem(STORE, JSON.stringify([...coracoes]));
    }
    function preview(t) { t = (t || "").trim(); return t.length > 170 ? t.slice(0, 170).trim() + "…" : t; }
    function filtrar() {
      const q = n($("q").value);
      return (DADOS.poemas || []).filter((p) => {
        if (filtro === "autor" && !p.favorito) return false;
        if (filtro === "meus" && !temCoracao(p.id)) return false;
        if (!q) return true;
        return n(p.titulo + " " + p.texto).includes(q);
      });
    }
    function render() {
      $("titulo").textContent = DADOS.titulo || "Poesias";
      $("subtitulo").textContent = DADOS.subtitulo || "";
      if (DADOS.nota) { $("nota").hidden = false; $("nota").textContent = DADOS.nota; }
      const itens = filtrar();
      $("contagem").textContent = itens.length + " poema" + (itens.length === 1 ? "" : "s");
      $("vazio").hidden = itens.length > 0;
      $("lista").innerHTML = itens.map((p) => `
        <div class="card" data-open="${esc(p.id)}">
          <div class="card-top">
            <h2>${esc(p.titulo)}</h2>
            <div class="icons">
              <span class="icon star ${p.favorito ? "on" : ""}" title="Favorito do autor">${p.favorito ? "★" : ""}</span>
              <button class="icon heart ${temCoracao(p.id) ? "on" : ""}" data-heart="${esc(p.id)}" aria-label="Meu favorito">${temCoracao(p.id) ? "♥" : "♡"}</button>
            </div>
          </div>
          <div class="preview">${esc(preview(p.texto))}</div>
        </div>`).join("");
    }
    function abrirPoema(id) {
      const p = (DADOS.poemas || []).find((x) => x.id === id);
      if (!p) return;
      aberto = { tipo: "poema", id: p.id };
      $("ler-titulo").textContent = p.titulo;
      $("ler-meta").textContent = p.favorito ? "Favorito do autor" : "";
      $("ler-texto").hidden = false;
      $("ler-texto").textContent = p.texto || "";
      $("ler-pdf").hidden = true;
      $("ler-pdf").src = "";
      pintarHeart();
      $("ler").showModal();
    }
    function abrirComp(id) {
      const c = (DADOS.compilacoes || []).find((x) => x.id === id);
      if (!c) return;
      aberto = { tipo: "comp", id: c.id };
      $("ler-titulo").textContent = c.titulo;
      $("ler-meta").textContent = "Compilação";
      $("drop-comp").classList.remove("open");
      if (c.tipo === "pdf") {
        $("ler-texto").hidden = true;
        $("ler-texto").textContent = "";
        $("ler-pdf").hidden = false;
        $("ler-pdf").src = c.preview;
      } else {
        $("ler-pdf").hidden = true;
        $("ler-pdf").src = "";
        $("ler-texto").hidden = false;
        $("ler-texto").textContent = c.texto || "Texto ainda não extraído. Espere o próximo ciclo do cache.";
      }
      pintarHeart();
      $("ler").showModal();
    }
    function pintarHeart() {
      const on = aberto && temCoracao(aberto.id);
      $("ler-heart").classList.toggle("on", !!on);
      $("ler-heart").textContent = on ? "♥" : "♡";
    }
    function montarMenu() {
      const comps = DADOS.compilacoes || [];
      const box = $("drop-comp");
      if (!comps.length) {
        box.innerHTML = "<button type='button' disabled>Nenhuma compilação na pasta</button>";
        return;
      }
      box.innerHTML = comps.map((c) =>
        `<button type="button" data-comp="${esc(c.id)}">${esc(c.titulo)} <span class="sub">${c.tipo === "pdf" ? "PDF" : "texto"}</span></button>`
      ).join("");
    }
    $("lista").addEventListener("click", (e) => {
      const h = e.target.closest("[data-heart]");
      if (h) {
        e.stopPropagation();
        toggleCoracao(h.dataset.heart);
        render();
        return;
      }
      const card = e.target.closest("[data-open]");
      if (card) abrirPoema(card.dataset.open);
    });
    $("ler-heart").onclick = () => {
      if (!aberto) return;
      toggleCoracao(aberto.id);
      pintarHeart();
      render();
    };
    $("btn-comp").onclick = () => $("drop-comp").classList.toggle("open");
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".menu")) $("drop-comp").classList.remove("open");
    });
    $("drop-comp").addEventListener("click", (e) => {
      const b = e.target.closest("[data-comp]");
      if (b) abrirComp(b.dataset.comp);
    });
    $("fechar").onclick = () => { $("ler-pdf").src = ""; $("ler").close(); };
    $("ler").addEventListener("click", (e) => { if (e.target === $("ler")) { $("ler-pdf").src = ""; $("ler").close(); } });
    $("q").addEventListener("input", render);
    function setFiltro(nome, btn) {
      filtro = nome;
      ["f-todas", "f-autor", "f-meus"].forEach((id) => $(id).classList.remove("active"));
      btn.classList.add("active");
      render();
    }
    $("f-todas").onclick = () => setFiltro("todas", $("f-todas"));
    $("f-autor").onclick = () => setFiltro("autor", $("f-autor"));
    $("f-meus").onclick = () => setFiltro("meus", $("f-meus"));
    Promise.all([
      fetch("poemas.json").then((r) => r.json()),
      fetch("compilacoes.json").then((r) => r.ok ? r.json() : []).catch(() => [])
    ]).then(([data, comps]) => {
      DADOS = data;
      DADOS.compilacoes = Array.isArray(comps) ? comps : (data.compilacoes || []);
      montarMenu();
      render();
    }).catch((err) => {
      DADOS.nota = "Não deu para carregar poemas.json. Confira se o arquivo está no repositório.";
      montarMenu();
      render();
    });
  </script>
</body>
</html>
